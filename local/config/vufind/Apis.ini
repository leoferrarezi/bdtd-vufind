; APIs externas usadas pelo módulo Bdtd.
[Oasisbr]
; URL base da oasisbr-api (termina com /api/v1/). Vazio = fallback de registros desligado.
; Usada por Bdtd\Record\FallbackLoader\Solr (IDs alterados e backup de registros removidos)
; e pelos JS de indicadores/fontes do tema.
; TODO: confirmar disponibilidade da API antes de ativar (decisão 7 em docs/bdtd/DECISOES.md).
oasisbr_api =
; Timeout em segundos das chamadas feitas pelo servidor
timeout = 5
