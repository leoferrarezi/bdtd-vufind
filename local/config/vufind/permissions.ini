; BDTD — somente o que difere do permissions.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../../../config/vufind/permissions.ini

; API de busca e registro aberta (usada por painéis Shiny/R e integrações externas),
; como no legado. O abuso é contido pelo RateLimiter e pelo fail2ban.
[api.SearchAndRecord]
permission[] = access.api.Search
permission[] = access.api.Record
require = ANY
ipRange[] = "0.0.0.0-255.255.255.255"
