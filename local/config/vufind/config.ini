; =============================================================================
; BDTD — somente o que difere do config.ini padrão do VuFind 11.
; O restante vem do arquivo pai (config/vufind/config.ini) via [Parent_Config].
; NUNCA colocar senhas aqui: este repositório é público. Use as opções *_file
; apontando para /etc/bdtd/secrets/ (criado por deploy/provision.sh).
; =============================================================================

[Parent_Config]
relative_path = ../../../config/vufind/config.ini
; [Database] inteira: senão o "database = mysql://..." do pai tem prioridade sobre os parâmetros abaixo
override_full_sections = "Languages,Database"

[System]
; Assistente /vufind/Install desligado após a verificação (recomendação do VuFind: não deixar
; público). Para conferir de novo: autoConfigure = true, deploy, verificar, voltar para false.
autoConfigure   = false

[Site]
; Homologação na VPS (NAT 18080 → 80; a 18080 é bloqueada pelos navegadores). Trocar no go-live.
url             = http://103.14.27.53:18080/vufind
email           = equipebdtd@ibict.br
title           = "BDTD"
theme           = bdtd
language        = pt-br
browserDetectLanguage = true
sidebarOnLeft   = true
timezone        = "America/Sao_Paulo"

[Index]
url             = http://localhost:8983/solr
default_core    = biblio

[Database]
database_driver        = pgsql
database_host          = localhost
database_port          = 5432
database_name          = vufind
database_username      = vufind
database_password_file = /etc/bdtd/secrets/db_password

[Session]
; Sessões no banco (o legado acumulava arquivos e precisava de script de limpeza)
type            = Database
lifetime        = 3600

[Mail]
; Sem envio de registros/buscas por e-mail nem SMS (como no legado)
email_action    = disabled
sms             = disabled

[SearchPlaceholder]
default         = search_placeholder_bdtd

[Content]
coversize       = false

[DOI]
show_in_results  = true
show_in_record   = true
show_in_holdings = true

[Languages]
pt-br       = "Brazilian Portugese"
en          = "English"
es          = "Spanish"

[Feedback]
tab_enabled       = true
recipient_email   = "equipebdtd@ibict.br"
recipient_name    = "BDTD"
email_subject     = "BDTD Contato"
sender_email      = "bdtd@ibict.br"
sender_name       = "BDTD Contato"

; Matomo da LA Referencia: DESLIGADO na homologação para não poluir as estatísticas
; de produção. No go-live: url = "https://matomo.lareferencia.info/", site_id = <id>.
;[Matomo]
;url = "https://matomo.lareferencia.info/"
;site_id =

[Logging]
; Erros e avisos do VuFind (logrotate em deploy/logrotate/bdtd)
file = /var/log/bdtd/vufind.log:alert,error,notice

; Recursos externos do tema bdtd (templates/layout/layout.phtml). Na homologação
; ficam DESLIGADOS para não contaminar estatísticas nem carregar scripts de terceiros.
; Valores de produção (legado): ver comentários.
[BdtdTheme]
gov_bar                  = false   ; produção: true  (barra.brasil.gov.br)
google_translate         = false   ; produção: true
userway_account          =         ; produção: gxYK4Xrqhn
google_site_verification =         ; produção: O4MlrfmxB744id4GdcKmv79sPQNLIjWzEB_VV9o1byw
bulk_export              = false   ; true só depois da reescrita da exportação em massa

; Google Analytics 4 — produção: apiKey = "G-HDE70XCBE2"
;[GoogleAnalytics]
;apiKey = "G-HDE70XCBE2"

[Social]
comments = disabled
lists    = disabled
tags     = disabled
