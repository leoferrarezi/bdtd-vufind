; =============================================================================
; BDTD — somente o que difere do config.ini padrão do VuFind 11.
; O restante vem do arquivo pai (config/vufind/config.ini) via [Parent_Config].
; NUNCA colocar senhas aqui: este repositório é público. Use as opções *_file
; apontando para /etc/bdtd/secrets/ (criado por deploy/provision.sh).
; =============================================================================

[Parent_Config]
relative_path = ../../../config/vufind/config.ini
; [Database] inteira: senão o "database = mysql://..." do pai tem prioridade sobre os parâmetros abaixo
override_full_sections = "Languages,Database"

[Site]
; Homologação na VPS (NAT 10080 → 80). Trocar no go-live.
url             = http://103.14.27.53:10080/vufind
email           = equipebdtd@ibict.br
title           = "BDTD"
; TODO(migração): trocar para "bdtd" quando o tema estiver portado para bootstrap5
theme           = sandal5
language        = pt-br
browserDetectLanguage = true
sidebarOnLeft   = true

[Index]
url             = http://localhost:8983/solr
default_core    = biblio

[Database]
database_driver        = pgsql
database_host          = localhost
database_port          = 5432
database_name          = vufind
database_username      = vufind
database_password_file = /etc/bdtd/secrets/db_password

[Session]
; Sessões no banco (o legado acumulava arquivos e precisava de script de limpeza)
type            = Database
lifetime        = 3600

[Content]
coversize       = false

[DOI]
show_in_results  = true
show_in_record   = true
show_in_holdings = true

[Languages]
pt-br       = "Brazilian Portugese"
en          = "English"
es          = "Spanish"

[Feedback]
tab_enabled       = true
recipient_email   = "equipebdtd@ibict.br"
recipient_name    = "BDTD"
email_subject     = "BDTD Contato"
sender_email      = "bdtd@ibict.br"
sender_name       = "BDTD Contato"

; Matomo da LA Referencia: DESLIGADO na homologação para não poluir as estatísticas
; de produção. No go-live: url = "https://matomo.lareferencia.info/", site_id = <id>.
;[Matomo]
;url = "https://matomo.lareferencia.info/"
;site_id =

[Logging]
; Erros e avisos do VuFind (logrotate em deploy/logrotate/bdtd)
file = /var/log/bdtd/vufind.log:alert,error,notice

[Social]
comments = disabled
lists    = disabled
tags     = disabled
