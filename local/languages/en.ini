about p1 = "The Brazilian Open Access Publications and Scientific Data Portal (Oasisbr) is an initiative of the Brazilian Institute of Information in Science and Technology (Ibict) that brings together scientific production and research data in open access, published in scientific journals, digital repositories of scientific publications, digital repositories of research data and digital libraries of theses and dissertations."
about p2 = "In this way, Oasisbr aims to gather, give visibility and access to a good part of the scientific content produced by researchers working in Brazilian and Portuguese institutions, published in aggregating systems of production and scientific data."
