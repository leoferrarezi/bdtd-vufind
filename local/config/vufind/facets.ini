; BDTD — somente o que difere do facets.ini padrão do VuFind 11.
[Parent_Config]
relative_path = ../../../config/vufind/facets.ini
override_full_sections = "Results"

; Facetas da tela de resultados (campos do índice LA Referencia / DSpace)
[Results]
instname_str                      = Institution
network_name_str                  = Source
dc.publisher.program.fl_str_mv    = Program
author_facet                      = Author
dc.contributor.advisor1.fl_str_mv = Advisor
format                            = Format
eu_rights_str_mv                  = "Access type"
language                          = Language
dc.subject.por.fl_str_mv          = "Subject"
dc.subject.eng.fl_str_mv          = "English Subject"
dc.subject.cnpq.fl_str_mv         = "CNPq Subject"
publishDate                       = "adv_search_year"

[Results_Settings]
facet_limit_by_field[instname_str] = -1
; No legado os nomes com ponto eram escritos com "--" por causa do tema antigo;
; no VuFind 11 usa-se o nome real do campo.
collapsedFacets = "instname_str,network_name_str,dc.publisher.program.fl_str_mv,author_facet,dc.contributor.advisor1.fl_str_mv,language,dc.subject.por.fl_str_mv,dc.subject.eng.fl_str_mv,dc.subject.cnpq.fl_str_mv"

[Advanced_Settings]
translated_facets[] = language
