# VirtualHost do BDTD (VuFind 11). Gerado por deploy/provision.sh a partir deste modelo:
# @APP_DIR@, @CACHE_DIR@ e @LOG_DIR@ são substituídos na instalação.
# Caminho base /vufind mantido igual ao legado (links externos e Google apontam para /vufind/Record/...).

<VirtualHost *:80>
    ServerName bdtd.local
    DocumentRoot /var/www/html

    ErrorLog  @LOG_DIR@/apache-error.log
    CustomLog @LOG_DIR@/apache-access.log combined

    # Raiz do site → catálogo
    RedirectMatch 302 ^/$ /vufind/

    # Homologação: não indexar em buscadores (remover no go-live)
    Header always set X-Robots-Tag "noindex, nofollow"

    # Cabeçalhos de segurança (CSP é enviada pelo próprio VuFind: contentsecuritypolicy.ini)
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    ServerSignature Off

    # PHP via FPM
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Recursos estáticos dos temas
    AliasMatch ^/vufind/themes/([0-9a-zA-Z-_]*)/(assets|css|images|js)/(.*)$ @APP_DIR@/themes/$1/$2/$3
    <Directory ~ "^@APP_DIR@/themes/([0-9a-zA-Z-_]*)/(assets|css|images|js)/">
        Require all granted
        AllowOverride None
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>

    # Cache público (asset pipeline)
    AliasMatch ^/vufind/cache/(.*)$ @CACHE_DIR@/public/$1
    <Directory @CACHE_DIR@/public/>
        Require all granted
        AllowOverride None
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
    </Directory>

    # Aplicação
    Alias /vufind @APP_DIR@/public
    <Directory @APP_DIR@/public/>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
    </Directory>

    <Location /vufind>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -s [OR]
        RewriteCond %{REQUEST_FILENAME} -l [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^.*$ - [NC,L]
        RewriteRule ^.*$ index.php [NC,L]

        SetEnv VUFIND_ENV production
        SetEnv VUFIND_LOCAL_DIR @SERVER_LOCAL_DIR@
        SetEnv VUFIND_CACHE_DIR @CACHE_DIR@
        SetEnv VUFIND_LOCAL_MODULES @LOCAL_MODULES@
    </Location>

    # Compressão
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
</VirtualHost>
